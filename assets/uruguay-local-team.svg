<svg width="1800" height="1200" viewBox="0 0 1800 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F19"/>
      <stop offset="0.55" stop-color="#113D32"/>
      <stop offset="1" stop-color="#1D6A53"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 320) rotate(23) scale(620 420)">
      <stop stop-color="#6EF5A8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6EF5A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1220 250) rotate(180) scale(500 360)">
      <stop stop-color="#DDF7EA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#DDF7EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FBF8" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#EAF5EE" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#061914" flood-opacity="0.22"/>
    </filter>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <rect width="1800" height="1200" fill="url(#glow1)"/>
  <rect width="1800" height="1200" fill="url(#glow2)"/>

  <!-- subtle editorial circles -->
  <circle cx="150" cy="1120" r="320" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <circle cx="1710" cy="100" r="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="1460" cy="920" r="220" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- soft glass panel -->
  <rect x="110" y="130" width="1580" height="940" rx="56" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)"/>

  <!-- Uruguay map block -->
  <g filter="url(#shadow)">
    <rect x="220" y="245" width="470" height="575" rx="34" fill="rgba(9,29,23,0.60)" stroke="rgba(110,245,168,0.18)"/>
    <text x="275" y="318" fill="#B8F7D0" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="2.2">URUGUAY</text>
    <text x="275" y="366" fill="#E9F7EF" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="600">Operación local con contexto y soporte.</text>

    <!-- stylized Uruguay silhouette -->
    <path d="M467 427
             C492 445 515 485 514 521
             C513 554 530 585 543 620
             C551 642 547 675 527 688
             C514 696 497 695 492 712
             C486 732 478 752 459 763
             C439 774 425 797 406 801
             C380 805 361 783 355 762
             C349 740 322 731 310 713
             C295 691 303 661 297 636
             C290 608 268 590 265 562
             C261 534 276 506 298 490
             C320 474 328 453 345 436
             C367 414 392 397 420 394
             C438 392 449 407 467 427 Z"
          fill="#0BC965" stroke="#B8F7D0" stroke-width="6"/>
    <path d="M385 503
             C408 492 431 495 451 507
             C470 518 480 536 487 556
             C495 580 500 603 504 626"
          stroke="#073323" stroke-width="5" stroke-linecap="round"/>
    <circle cx="452" cy="452" r="14" fill="#F8FBF8"/>
    <text x="475" y="461" fill="#EAF5EE" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700">Montevideo</text>
    <text x="275" y="866" fill="#EAF5EE" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700">Búsquedas · Payrolling · Intermediación · RR. HH.</text>
  </g>

  <!-- team / hr cards -->
  <g filter="url(#shadow)">
    <rect x="770" y="225" width="750" height="250" rx="34" fill="url(#card)"/>
    <text x="840" y="290" fill="#115341" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="1.8">FORMAR EQUIPO LOCAL</text>
    <text x="840" y="342" fill="#173D32" font-family="Manrope, Arial, sans-serif" font-size="54" font-weight="800">Talento, estructura y</text>
    <text x="840" y="406" fill="#173D32" font-family="Manrope, Arial, sans-serif" font-size="54" font-weight="800">procesos desde el inicio.</text>

    <!-- mini icons -->
    <g transform="translate(840 148)">
      <rect x="0" y="196" width="86" height="86" rx="22" fill="#DFF7E9"/>
      <circle cx="43" cy="232" r="18" stroke="#115341" stroke-width="5"/>
      <path d="M28 259 C32 245 54 245 58 259" stroke="#115341" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(956 148)">
      <rect x="0" y="196" width="86" height="86" rx="22" fill="#DFF7E9"/>
      <rect x="25" y="214" width="38" height="34" rx="8" stroke="#115341" stroke-width="5"/>
      <path d="M30 258 H58" stroke="#115341" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(1072 148)">
      <rect x="0" y="196" width="86" height="86" rx="22" fill="#DFF7E9"/>
      <path d="M27 254 L42 238 L53 248 L63 222" stroke="#115341" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="540" width="360" height="280" rx="32" fill="rgba(9,29,23,0.64)" stroke="rgba(110,245,168,0.18)"/>
    <text x="825" y="606" fill="#B8F7D0" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1.4">PRIMERAS BÚSQUEDAS</text>
    <circle cx="880" cy="712" r="48" fill="#0BC965"/>
    <circle cx="964" cy="712" r="48" fill="#CFEFDA"/>
    <circle cx="1048" cy="712" r="48" fill="#0BC965" opacity="0.85"/>
    <path d="M856 763 C880 730 904 730 928 763" stroke="#073323" stroke-width="5" stroke-linecap="round"/>
    <path d="M940 763 C964 730 988 730 1012 763" stroke="#115341" stroke-width="5" stroke-linecap="round"/>
    <text x="825" y="795" fill="#EAF5EE" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700">Perfiles alineados al rol y a tu cultura.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1160" y="540" width="360" height="280" rx="32" fill="rgba(9,29,23,0.64)" stroke="rgba(110,245,168,0.18)"/>
    <text x="1215" y="606" fill="#B8F7D0" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1.4">PAYROLL Y SOPORTE</text>
    <rect x="1245" y="666" width="190" height="92" rx="18" fill="#F3F9F5"/>
    <path d="M1278 705 H1400" stroke="#115341" stroke-width="8" stroke-linecap="round"/>
    <path d="M1278 731 H1366" stroke="#115341" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
    <path d="M1278 757 H1388" stroke="#115341" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
    <text x="1215" y="795" fill="#EAF5EE" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700">Administración y operación con menos fricción.</text>
  </g>

  <!-- floating local badge -->
  <g filter="url(#shadow)">
    <circle cx="1505" cy="250" r="78" fill="#0BC965"/>
    <text x="1456" y="244" fill="#073323" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800">EQUIPO</text>
    <text x="1471" y="276" fill="#073323" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="800">LOCAL</text>
  </g>

  <!-- soft blurred highlight -->
  <circle cx="1180" cy="990" r="120" fill="#6EF5A8" fill-opacity="0.12" filter="url(#blur)"/>
</svg>
